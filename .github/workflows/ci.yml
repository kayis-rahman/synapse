name: CI

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  build-and-test:
    name: Build and Unit Tests
    runs-on: [self-hosted, macOS, ARM64, wool-ci]
    timeout-minutes: 90
    env:
      DERIVED_DATA_PATH: ${{ runner.workspace }}/derived-data
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check memory pressure
        run: |
          memory_pressure

      - name: Boot iPhone 18 Pro simulator
        run: |
          DEVICE_ID="$(xcrun simctl list devices available | awk -v name='iPhone 18 Pro' '$0 ~ name { match($0, /[A-F0-9-]{36}/); if (RSTART) { print substr($0, RSTART, RLENGTH); exit } }')"
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone 18 Pro simulator found."
            exit 1
          fi
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Build and run unit tests
        run: |
          xcodebuild test \
            -project apple/Wool/Wool.xcodeproj \
            -scheme "Wool iOS Unit Tests" \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -enableCodeCoverage NO

      - name: Clean derived data
        if: always()
        run: |
          rm -rf "${DERIVED_DATA_PATH}"

  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: CI required summary
        run: echo "Build and unit tests passed."
